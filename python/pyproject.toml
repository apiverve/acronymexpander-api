[project]
name = "apiverve-acronymexpander"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Acronym Expander resolves acronyms and abbreviations into their full meanings, complete with subject categories and definitions. Submit any short term up to 20 characters to get matching expansions and explanations for each domain."
keywords = ["acronym api", "acronym meaning api", "abbreviation api", "acronym expander api", "acronym lookup api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/acronymexpander?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/acronymexpander?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/acronymexpander-api"
Twitter = "https://twitter.com/apivervehq"
